name: tests

on:
  # pull_request:
  #   branches: [main]
  #   paths-ignore:
  #     - "Web-Client/**"
  #     - "__docs/**"
  #     - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: DB-Postgres
            postgres: true
          - module: Getaway
          - module: Client-API
            postgres: true
            rabbitmq: true
          - module: Worker
            rabbitmq: true
          - module: Notification
            rabbitmq: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      - name: Start PostgreSQL
        if: matrix.postgres
        run: docker compose up -d --wait --quiet-pull postgres

      - name: Start RabbitMQ
        if: matrix.rabbitmq
        run: |
          docker compose up -d --wait --quiet-pull rabbitmq
          docker compose run --rm --quiet-pull rabbitmq-init

      - name: Test
        run: ./mvnw -B -ntp -pl ${{ matrix.module }} test

      - name: Surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports/

      - name: Infrastructure logs
        if: failure()
        run: docker compose logs --no-color --tail 200

  integration:
    needs: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Integration tests
        run: tests/run.sh --only integration

      - name: Summary
        if: always()
        run: |
          if [ -f tests/reports/latest/summary.md ]; then
            cat tests/reports/latest/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stack-tests
          path: |
            tests/reports/
            !tests/reports/latest
          if-no-files-found: ignore
