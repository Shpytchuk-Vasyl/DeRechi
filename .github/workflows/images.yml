name: images

on:
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - "Web-Client/**"
  #     - "__docs/**"
  #     - "tests/**"
  #     - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgis
            context: docker/postgres
            build-args: POSTGIS_IMAGE=imresamu/postgis:17-3.5
          - name: db-postgres
            context: .
            build-args: MODULE=DB-Postgres
          - name: getaway
            context: .
            build-args: MODULE=Getaway
          - name: client-api
            context: .
            build-args: MODULE=Client-API
          - name: worker
            context: .
            build-args: MODULE=Worker
          - name: notification
            context: .
            build-args: MODULE=Notification
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/derechi-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
