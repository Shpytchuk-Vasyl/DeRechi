name: images

on:
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - "Web-Client/**"
  #     - "__docs/**"
  #     - "tests/**"
  #     - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - id: buildx
        uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: m2
        uses: actions/cache@v6
        with:
          path: m2
          key: images-m2-${{ hashFiles('pom.xml', '*/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: images-m2-

      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: '{"m2": "/root/.m2"}'
          skip-extraction: ${{ steps.m2.outputs.cache-hit }}

      - id: registry
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          push: true
          vars: |
            REGISTRY=${{ steps.registry.outputs.name }}
            SHA=${{ github.sha }}
