global:
  scrape_interval: 5s
  external_labels:
    project: derechi-tests

scrape_configs:
  - job_name: derechi-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["client-api:8082"]
        labels: { application: Client-API }
      - targets: ["worker:8085"]
        labels: { application: Worker }
      - targets: ["notification:8084"]
        labels: { application: Notification }

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
