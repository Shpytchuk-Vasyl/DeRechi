#
#   tests/run.sh          # builds and starts this stack, runs the tests, writes the report
#

name: derechi-tests

x-service: &service
  build:
    context: ..
    dockerfile: Dockerfile
  environment: &service-env
    POSTGRES_HOST: postgres
    POSTGRES_USER: derechi
    POSTGRES_PASSWORD: derechi
    POSTGRES_DB: derechi
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: derechi
    RABBITMQ_PASSWORD: derechi
    JAVA_OPTS: ${TESTS_JAVA_OPTS:--Xms128m -Xmx384m}
  depends_on: &service-deps
    migrations:
      condition: service_completed_successfully
    rabbitmq-init:
      condition: service_completed_successfully

services:

  postgres:
    build: ../docker/postgres
    image: derechi/postgis:17-3.5-uk
    environment:
      POSTGRES_USER: derechi
      POSTGRES_PASSWORD: derechi
      POSTGRES_DB: derechi
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U derechi -d derechi -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrations:
    build: infra/migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_ANALYTICS_ENABLED: "false"
    volumes:
      - ../DB-Postgres/changelog:/liquibase/changelog:ro
    command:
      - --search-path=/liquibase/changelog
      - --changelog-file=changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/derechi
      - --username=derechi
      - --password=derechi
      - update

  rabbitmq:
    image: rabbitmq:4.3.5-management
    environment:
      RABBITMQ_DEFAULT_USER: derechi
      RABBITMQ_DEFAULT_PASS: derechi
    volumes:
      - ../docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-derechi.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  rabbitmq-init:
    image: curlimages/curl:8.16.0
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../docker/rabbitmq/definitions.json:/definitions.json:ro
    command:
      - -sS
      - --fail-with-body
      - --retry
      - "5"
      - --retry-all-errors
      - -u
      - derechi:derechi
      - -H
      - "Content-Type: application/json"
      - -X
      - POST
      - --data
      - "@/definitions.json"
      - http://rabbitmq:15672/api/definitions

  mailpit:
    image: axllent/mailpit:v1.28
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${TESTS_MAILPIT_PORT:-18025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  client-api:
    <<: *service
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: Client-API
    environment:
      <<: *service-env
      FOURTHWALL_WEBHOOK_SECRET: tests-webhook-secret

  worker:
    <<: *service
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: Worker
    environment:
      <<: *service-env
      DERECHI_SITE_URL: http://localhost:3000

  notification:
    <<: *service
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: Notification
    environment:
      <<: *service-env
      NOTIFY_EMAIL_HOST: mailpit
    depends_on:
      <<: *service-deps
      mailpit:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${TESTS_PROMETHEUS_PORT:-19090}:9090"

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${TESTS_GRAFANA_PORT:-13000}:3000"
    depends_on:
      - prometheus

  # --- runners, started by run.sh with `docker compose run` -------------------------------

  ready:
    image: curlimages/curl:8.16.0
    profiles: [runner]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for url in http://client-api:9082 http://worker:9085 http://notification:9084; do
          n=0; until curl -sf "$$url/actuator/health" | grep -q '"status":"UP"'; do
            n=$$((n+1)); [ $$n -gt 90 ] && echo "$$url is not UP" && exit 1; sleep 2;
          done; echo "$$url UP";
        done

  integration:
    image: eclipse-temurin:26-jdk
    profiles: [runner]
    working_dir: /w
    volumes:
      - ..:/w
      - m2:/root/.m2
      - ${TESTS_REPORT_DIR:-./reports/latest}:/reports
    environment:
      CLIENT_API_URL: http://client-api:8082
      MAILPIT_URL: http://mailpit:8025
      POSTGRES_URL: jdbc:postgresql://postgres:5432/derechi
      POSTGRES_USER: derechi
      POSTGRES_PASSWORD: derechi
      FOURTHWALL_WEBHOOK_SECRET: tests-webhook-secret
    command: ["sh", "./mvnw", "-B", "-f", "tests/integration/pom.xml", "test", "-Dreports.dir=/reports/integration"]

  k6:
    image: grafana/k6:2.3.0
    profiles: [runner]
    working_dir: /scripts
    volumes:
      - ./load:/scripts:ro
      - ${TESTS_REPORT_DIR:-./reports/latest}:/reports
    environment:
      BASE_URL: http://client-api:8082
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),avg,max
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_EXPORT: /reports/load/report.html
      K6_WEB_DASHBOARD_PERIOD: 2s
    command: ["run", "--summary-export=/reports/load/summary.json", "client-api.js"]

  report:
    image: python:3.13-alpine
    profiles: [runner]
    working_dir: /reports
    volumes:
      - ./infra/report.py:/report.py:ro
      - ${TESTS_REPORT_DIR:-./reports/latest}:/reports
    command: ["python", "/report.py", "/reports"]

volumes:
  m2:
    name: derechi-tests-m2
    external: true
