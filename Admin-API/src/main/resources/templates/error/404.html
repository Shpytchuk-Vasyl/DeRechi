<!DOCTYPE html>
<html class="has-navbar-fixed-top" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{error.404.head})}"></head>
<body class="is-flex is-flex-direction-column">
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="section is-flex-grow-1">
    <div class="container is-max-desktop">
        <div class="notification is-danger is-light">
            <h1 class="title is-4">
                <span class="icon is-large" aria-hidden="true"><i class="fa-2x fa-solid fa-magnifying-glass"></i></span>
                <span th:text="#{error.404.title}">404</span>
            </h1>
            <p class="mb-4" th:text="${message}">error</p>
            <a class="button is-light" th:href="@{/admin/matches}">
                <span class="icon" aria-hidden="true"><i class="fa-solid fa-compass"></i></span><span th:text="#{action.home}">Home</span>
            </a>
        </div>
    </div>
</main>
</body>
</html>
