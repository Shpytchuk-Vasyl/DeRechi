<!DOCTYPE html>
<html class="has-navbar-fixed-top" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{__${titleKey}__})}"></head>
<body class="is-flex is-flex-direction-column">

<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="section pt-5 is-flex-grow-1">
    <div class="container is-max-desktop">

        <nav class="breadcrumb is-small" aria-label="breadcrumbs">
            <ul>
                <li><a th:href="@{${basePath}}" th:text="#{__${titleKey}__}">Items</a></li>
                <li class="is-active">
                    <a aria-current="page"
                       th:text="${creating} ? #{form.new} : '#' + ${form.id}">new</a>
                </li>
            </ul>
        </nav>

        <h1 class="title is-4"
            th:text="#{__${titleKey}__} + ': ' + (${creating} ? #{form.new} : '#' + ${form.id})">Form</h1>

        <form th:object="${form}"
              th:action="${creating} ? @{${basePath}} : @{${basePath} + '/' + ${form.id}}"
              method="post">

            <div th:if="${#fields.hasErrors('*')}" class="notification is-danger is-light">
                <p class="has-text-weight-semibold">
                    <span aria-hidden="true"><i class="fa-solid fa-triangle-exclamation"></i></span> <span th:text="#{form.invalid}">Check the form</span>
                </p>
                <p th:each="error : ${#fields.errors('*')}" th:text="${error}">error</p>
            </div>

            <div class="box">
                <div class="field">
                    <label class="label" th:text="#{field.title}">Title</label>
                    <div class="control">
                        <input class="input" th:classappend="${#fields.hasErrors('title')} ? 'is-danger'"
                               type="text" th:field="*{title}" required maxlength="100">
                    </div>
                </div>

                <div class="field">
                    <label class="label" th:text="#{field.description}">Description</label>
                    <div class="control">
                        <textarea class="textarea" rows="3" th:field="*{description}" maxlength="250"></textarea>
                    </div>
                </div>

                <div class="field">
                    <label class="label"><span class="icon has-text-grey mr-1" aria-hidden="true"><i class="fa-solid fa-image"></i></span><span th:text="#{field.imagePath}">Image (path)</span></label>
                    <div class="control">
                        <input class="input" type="text" th:field="*{image}" maxlength="200">
                    </div>
                </div>

                <div class="columns">
                    <div class="column">
                        <div class="field">
                            <label class="label"><span class="icon has-text-grey mr-1" aria-hidden="true"><i class="fa-solid fa-calendar-days"></i></span><span th:text="#{field.date}">Date</span></label>
                            <div class="control">
                                <input class="input" type="date" th:field="*{date}" required>
                            </div>
                        </div>
                    </div>
                    <div class="column">
                        <div class="field">
                            <label class="label"><span class="icon has-text-grey mr-1" aria-hidden="true"><i class="fa-solid fa-coins"></i></span><span th:text="#{field.compensation}">Reward</span></label>
                            <div class="control">
                                <input class="input" type="number" th:field="*{compensation}" min="0">
                            </div>
                        </div>
                    </div>
                    <div class="column">
                        <div class="field">
                            <label class="label"><span class="icon has-text-grey mr-1" aria-hidden="true"><i class="fa-solid fa-tag"></i></span><span th:text="#{field.category}">Category</span></label>
                            <div class="control">
                                <div class="select is-fullwidth">
                                    <select th:field="*{categoryId}" required>
                                        <option th:each="category : ${categories}"
                                                th:value="${category.id}" th:text="#{category.__${category.key}__}">OTHER</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="box">
                <h2 class="title is-6"><span aria-hidden="true"><i class="fa-solid fa-location-dot"></i></span> <span th:text="#{field.place}">Place</span></h2>

                <div class="field">
                    <label class="label">Google place id</label>
                    <div class="control">
                        <input class="input" type="text" th:field="*{placeId}" required maxlength="255">
                    </div>
                </div>

                <div class="field">
                    <label class="label" th:text="#{field.placeName}">Place name</label>
                    <div class="control">
                        <input class="input" type="text" th:field="*{placeName}" required maxlength="100">
                    </div>
                </div>

                <div class="columns">
                    <div class="column">
                        <div class="field">
                            <label class="label" th:text="#{field.latitude}">Latitude</label>
                            <div class="control">
                                <input class="input" type="number" step="any" th:field="*{lat}" required>
                            </div>
                        </div>
                    </div>
                    <div class="column">
                        <div class="field">
                            <label class="label" th:text="#{field.longitude}">Longitude</label>
                            <div class="control">
                                <input class="input" type="number" step="any" th:field="*{lon}" required>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="box">
                <h2 class="title is-6"><span aria-hidden="true"><i class="fa-solid fa-address-card"></i></span> <span th:text="#{field.contacts}">Contacts</span></h2>

                <div class="columns">
                    <div class="column">
                        <div class="field">
                            <label class="label"><span class="icon has-text-grey mr-1" aria-hidden="true"><i class="fa-solid fa-phone"></i></span><span th:text="#{field.phone}">Phone</span></label>
                            <div class="control">
                                <input class="input" type="text" th:field="*{phone}" required
                                       placeholder="+380671234567">
                            </div>
                        </div>
                    </div>
                    <div class="column">
                        <div class="field">
                            <label class="label"><span class="icon has-text-grey mr-1" aria-hidden="true"><i class="fa-solid fa-envelope"></i></span>Email</label>
                            <div class="control">
                                <input class="input" type="email" th:field="*{email}" required maxlength="50">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="field">
                    <label class="label"><span class="icon has-text-grey mr-1" aria-hidden="true"><i class="fa-solid fa-comments"></i></span><span th:text="#{field.socialMedia}">Social media</span></label>
                    <div class="control">
                        <label class="checkbox mr-4" th:each="social : ${allSocialMedias}">
                            <input type="checkbox" th:field="*{socialMedias}" th:value="${social}">
                            <span th:text="${social}">TELEGRAM</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="field is-grouped">
                <div class="control">
                    <button type="submit" class="button is-primary">
                        <span class="icon" aria-hidden="true">
                            <i class="fa-solid" th:classappend="${creating} ? 'fa-plus' : 'fa-floppy-disk'"></i>
                        </span>
                        <span th:text="${creating} ? #{action.create} : #{action.save}">Save</span>
                    </button>
                </div>
                <div class="control">
                    <a class="button is-light" th:href="@{${basePath}}">
                        <span class="icon" aria-hidden="true"><i class="fa-solid fa-xmark"></i></span><span th:text="#{action.cancel}">Cancel</span>
                    </a>
                </div>
            </div>
        </form>
    </div>
</main>

</body>
</html>
