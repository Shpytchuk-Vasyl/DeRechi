<!DOCTYPE html>
<html class="has-navbar-fixed-top" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{__${titleKey}__})}"></head>
<body class="is-flex is-flex-direction-column">

<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="section pt-5 is-flex-grow-1">
    <div class="container is-max-desktop">

        <nav class="breadcrumb is-small" aria-label="breadcrumbs">
            <ul>
                <li><a th:href="@{${basePath}}" th:text="#{__${titleKey}__}">Items</a></li>
                <li class="is-active">
                    <a aria-current="page"
                       th:text="${creating} ? #{form.new} : '#' + ${form.id}">new</a>
                </li>
            </ul>
        </nav>

        <h1 class="title is-4"
            th:text="#{__${titleKey}__} + ': ' + (${creating} ? #{form.new} : '#' + ${form.id})">Form</h1>

        <form th:object="${form}"
              th:action="${creating} ? @{${basePath}} : @{${basePath} + '/' + ${form.id}}"
              method="post">

            <div th:if="${#fields.hasErrors('*')}" class="notification is-danger is-light">
                <p class="has-text-weight-semibold">
                    <span class="icon" aria-hidden="true"><i class="fa-solid fa-triangle-exclamation"></i></span>
                    <span th:text="#{form.invalid}">Check the form</span>
                </p>
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">error</p>
            </div>

            <div class="box">
                <h2 class="form-section-title title is-6">
                    <span class="icon has-text-grey" aria-hidden="true"><i class="fa-solid fa-box-open"></i></span>
                    <span th:text="#{form.section.item}">Item</span>
                </h2>

                <div class="field">
                    <label class="label" for="title" th:text="#{field.title}">Title</label>
                    <div class="control">
                        <input class="input" type="text" id="title" th:field="*{title}" th:errorclass="is-danger"
                               required maxlength="100" autocomplete="off" autofocus
                               th:placeholder="#{placeholder.title}">
                    </div>
                    <p class="help is-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">error</p>
                </div>

                <div class="field">
                    <label class="label" for="description" th:text="#{field.description}">Description</label>
                    <div class="control">
                        <textarea class="textarea" rows="3" id="description" th:field="*{description}"
                                  th:errorclass="is-danger" maxlength="250" autocomplete="off"
                                  th:placeholder="#{placeholder.description}"></textarea>
                    </div>
                    <p class="help is-danger" th:if="${#fields.hasErrors('description')}"
                       th:errors="*{description}">error</p>
                </div>

                <div class="field">
                    <label class="label">
                        <span class="icon has-text-grey mr-1" aria-hidden="true"><i class="fa-solid fa-image"></i></span>
                        <span th:text="#{field.image}">Image</span>
                    </label>

                    <input type="hidden" th:field="*{image}">

                    <figure class="image-current thumb image is-96x96 mb-3"
                            th:if="${form.image != null and !form.image.isBlank()}" id="image-current">
                        <img th:src="${uploads.urlOf(form.image)}" alt="">
                    </figure>

                    <input type="file" id="image-upload" accept="image/*"
                           th:data-url="@{${uploadPath}}"
                           th:data-max-size="${uploads.maxBytes}"
                           th:data-label="#{form.image.drop}"
                           th:data-too-large="#{upload.tooLarge}"
                           th:data-unsupported="#{upload.unsupportedType}">

                    <p class="help" th:text="#{form.image.hint}">Drop an image or pick a file</p>
                    <p class="help is-danger" th:if="${#fields.hasErrors('image')}" th:errors="*{image}">error</p>
                </div>

                <div class="columns">
                    <div class="column">
                        <div class="field">
                            <label class="label" for="date">
                                <span class="icon has-text-grey mr-1" aria-hidden="true"><i
                                        class="fa-solid fa-calendar-days"></i></span>
                                <span th:text="#{field.date}">Date</span>
                            </label>
                            <div class="control">
                                <input class="input" type="date" id="date" th:field="*{date}"
                                       th:errorclass="is-danger" required autocomplete="off">
                            </div>
                            <p class="help is-danger" th:if="${#fields.hasErrors('date')}"
                               th:errors="*{date}">error</p>
                        </div>
                    </div>
                    <div class="column">
                        <div class="field">
                            <label class="label" for="compensation">
                                <span class="icon has-text-grey mr-1" aria-hidden="true"><i
                                        class="fa-solid fa-coins"></i></span>
                                <span th:text="#{field.compensation}">Reward</span>
                            </label>
                            <div class="control">
                                <input class="input" type="number" id="compensation" th:field="*{compensation}"
                                       th:errorclass="is-danger" min="0" step="1" inputmode="numeric"
                                       autocomplete="off" placeholder="0">
                            </div>
                            <p class="help is-danger" th:if="${#fields.hasErrors('compensation')}"
                               th:errors="*{compensation}">error</p>
                        </div>
                    </div>
                    <div class="column">
                        <div class="field">
                            <label class="label" for="categoryId">
                                <span class="icon has-text-grey mr-1" aria-hidden="true"><i
                                        class="fa-solid fa-tag"></i></span>
                                <span th:text="#{field.category}">Category</span>
                            </label>
                            <div class="control">
                                <div class="select is-fullwidth">
                                    <select id="categoryId" th:field="*{categoryId}" required>
                                        <option th:each="category : ${categories}"
                                                th:value="${category.id}"
                                                th:text="#{category.__${category.key}__}">OTHER</option>
                                    </select>
                                </div>
                            </div>
                            <p class="help is-danger" th:if="${#fields.hasErrors('categoryId')}"
                               th:errors="*{categoryId}">error</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="box">
                <h2 class="form-section-title title is-6">
                    <span class="icon has-text-grey" aria-hidden="true"><i
                            class="fa-solid fa-location-dot"></i></span>
                    <span th:text="#{field.place}">Place</span>
                </h2>

                <!-- Поле навмисно без `name`: воно лише керує віджетом, а на сервер
                     їдуть placeId/placeName/lat/lon, які той заповнює. -->
                <div class="field" th:if="${maps.enabled}">
                    <label class="label" for="place-search" th:text="#{form.place.search}">Find a place</label>
                    <div class="control has-icons-left">
                        <input class="input" type="text" id="place-search" autocomplete="off"
                               th:data-region="${maps.region}" th:placeholder="#{placeholder.placeSearch}">
                        <span class="icon is-small is-left has-text-grey" aria-hidden="true">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                    </div>
                    <p class="help" th:text="#{form.place.hint}">The fields below fill in automatically.</p>
                    <p class="help has-text-weight-medium is-hidden" id="place-chosen"></p>
                </div>

                <div class="notification is-warning is-light py-2 px-3 mb-4" th:unless="${maps.enabled}">
                    <span class="icon has-text-grey mr-1" aria-hidden="true"><i
                            class="fa-solid fa-circle-info"></i></span>
                    <span th:text="#{form.place.unavailable}">Place search is off</span>
                </div>

                <div class="field">
                    <label class="label" for="placeName" th:text="#{field.placeName}">Place name</label>
                    <div class="control">
                        <input class="input" type="text" id="placeName" th:field="*{placeName}"
                               th:errorclass="is-danger" required maxlength="100" autocomplete="off"
                               th:placeholder="#{placeholder.placeName}">
                    </div>
                    <p class="help is-danger" th:if="${#fields.hasErrors('placeName')}"
                       th:errors="*{placeName}">error</p>
                </div>

                <!-- Технічні поля: їх заповнює віджет, але без ключа (чи коли Google мовчить)
                     місце має лишатися доступним вручну. `required` тут навмисно немає —
                     браузер не вміє фокусувати порожнє поле всередині згорнутого <details>. -->
                <details class="place-manual" id="place-manual"
                         th:open="${!maps.enabled or #fields.hasErrors('placeId') or #fields.hasErrors('lat') or #fields.hasErrors('lon')}">
                    <summary class="is-size-7 has-text-grey" th:text="#{form.place.manual}">Enter manually</summary>

                    <div class="field mt-3">
                        <label class="label" for="placeId" th:text="#{field.placeId}">Google place id</label>
                        <div class="control">
                            <input class="input" type="text" id="placeId" th:field="*{placeId}"
                                   th:errorclass="is-danger" maxlength="255" autocomplete="off"
                                   placeholder="ChIJ...">
                        </div>
                        <p class="help is-danger" th:if="${#fields.hasErrors('placeId')}"
                           th:errors="*{placeId}">error</p>
                    </div>

                    <div class="columns">
                        <div class="column">
                            <div class="field">
                                <label class="label" for="lat" th:text="#{field.latitude}">Latitude</label>
                                <div class="control">
                                    <input class="input numeric" type="number" step="any" id="lat" th:field="*{lat}"
                                           th:errorclass="is-danger" min="-90" max="90" inputmode="decimal"
                                           autocomplete="off" placeholder="50.4501">
                                </div>
                                <p class="help is-danger" th:if="${#fields.hasErrors('lat')}"
                                   th:errors="*{lat}">error</p>
                            </div>
                        </div>
                        <div class="column">
                            <div class="field">
                                <label class="label" for="lon" th:text="#{field.longitude}">Longitude</label>
                                <div class="control">
                                    <input class="input numeric" type="number" step="any" id="lon" th:field="*{lon}"
                                           th:errorclass="is-danger" min="-180" max="180" inputmode="decimal"
                                           autocomplete="off" placeholder="30.5234">
                                </div>
                                <p class="help is-danger" th:if="${#fields.hasErrors('lon')}"
                                   th:errors="*{lon}">error</p>
                            </div>
                        </div>
                    </div>
                </details>
            </div>

            <div class="box">
                <h2 class="form-section-title title is-6">
                    <span class="icon has-text-grey" aria-hidden="true"><i
                            class="fa-solid fa-address-card"></i></span>
                    <span th:text="#{field.contacts}">Contacts</span>
                </h2>

                <div class="columns">
                    <div class="column">
                        <div class="field">
                            <label class="label" for="phone">
                                <span class="icon has-text-grey mr-1" aria-hidden="true"><i
                                        class="fa-solid fa-phone"></i></span>
                                <span th:text="#{field.phone}">Phone</span>
                            </label>
                            <div class="control">
                                <input class="input numeric" type="tel" id="phone" th:field="*{phone}"
                                       th:errorclass="is-danger" required autocomplete="tel" inputmode="tel"
                                       placeholder="+380671234567">
                            </div>
                            <p class="help is-danger" th:if="${#fields.hasErrors('phone')}"
                               th:errors="*{phone}">error</p>
                        </div>
                    </div>
                    <div class="column">
                        <div class="field">
                            <label class="label" for="email">
                                <span class="icon has-text-grey mr-1" aria-hidden="true"><i
                                        class="fa-solid fa-envelope"></i></span>
                                <span>Email</span>
                            </label>
                            <div class="control">
                                <input class="input" type="email" id="email" th:field="*{email}"
                                       th:errorclass="is-danger" required maxlength="50" autocomplete="email"
                                       inputmode="email" th:placeholder="#{placeholder.email}">
                            </div>
                            <p class="help is-danger" th:if="${#fields.hasErrors('email')}"
                               th:errors="*{email}">error</p>
                        </div>
                    </div>
                </div>

                <div class="field">
                    <label class="label">
                        <span class="icon has-text-grey mr-1" aria-hidden="true"><i
                                class="fa-solid fa-comments"></i></span>
                        <span th:text="#{field.socialMedia}">Social media</span>
                    </label>
                    <div class="control">
                        <label class="checkbox mr-4" th:each="messenger : ${allSocialMedias}">
                            <input type="checkbox" th:field="*{socialMedias}" th:value="${messenger}">
                            <span class="icon is-small messenger"
                                  th:classappend="'messenger-' + ${#strings.toLowerCase(messenger)}"
                                  aria-hidden="true"><i th:class="${social.icon(messenger)}"></i></span>
                            <span th:text="#{social.__${messenger}__}">TELEGRAM</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="field is-grouped">
                <div class="control">
                    <button type="submit" class="button is-primary">
                        <span class="icon" aria-hidden="true">
                            <i class="fa-solid" th:classappend="${creating} ? 'fa-plus' : 'fa-floppy-disk'"></i>
                        </span>
                        <span th:text="${creating} ? #{action.create} : #{action.save}">Save</span>
                    </button>
                </div>
                <div class="control">
                    <a class="button is-light" th:href="@{${basePath}}">
                        <span class="icon" aria-hidden="true"><i class="fa-solid fa-xmark"></i></span><span
                            th:text="#{action.cancel}">Cancel</span>
                    </a>
                </div>
            </div>
        </form>
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/filepond/4.32.10/filepond.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/filepond-plugin-image-preview@4/dist/filepond-plugin-image-preview.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/filepond-plugin-file-validate-type@1/dist/filepond-plugin-file-validate-type.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/filepond-plugin-file-validate-size@2/dist/filepond-plugin-file-validate-size.min.js"></script>
<script th:src="@{/js/image-upload.js}"></script>

<th:block th:if="${maps.enabled}">
    <script th:src="@{/js/place-autocomplete.js}"></script>
    <script async th:src="${maps.scriptUrl}"></script>
</th:block>

</body>
</html>
