<!DOCTYPE html>
<html class="has-navbar-fixed-top" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body class="is-flex is-flex-direction-column">

<header th:replace="~{fragments/layout :: nav}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="section pt-5 is-flex-grow-1">
    <div class="container is-fluid">

        <div class="level mb-5">
            <div class="level-left">
                <div class="level-item">
                    <h1 class="title is-4 mb-0" th:text="${title}">Речі</h1>
                </div>
                <div class="level-item">
                    <span class="tag is-light is-rounded" th:text="${itemsLabel}">0 записів</span>
                </div>
            </div>
            <div class="level-right">
                <div class="level-item">
                    <a class="button is-primary" th:if="${perms.can(scope, 'CREATE')}"
                       th:href="@{${basePath} + '/new'}">
                        <span class="icon" aria-hidden="true"><i class="fa-solid fa-plus"></i></span><span>Додати</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="box p-0">
            <div class="table-container">
                <table class="table is-fullwidth is-hoverable mb-0 items-table">
                    <thead>
                    <tr>
                        <th class="is-size-7 is-uppercase has-text-grey">#</th>
                        <th class="is-size-7 is-uppercase has-text-grey"><span class="is-sr-only">Зображення</span></th>
                        <th class="is-size-7 is-uppercase has-text-grey">Назва</th>
                        <th class="is-size-7 is-uppercase has-text-grey">Дата</th>
                        <th class="is-size-7 is-uppercase has-text-grey">Місце</th>
                        <th class="is-size-7 is-uppercase has-text-grey"><span class="is-sr-only">Дії</span></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${items.content}">
                        <td class="id is-vcentered py-3">
                            <button type="button" class="button is-ghost p-0" command="show-modal"
                                    th:commandfor="'item-' + ${item.id}"
                                    th:text="${item.id}">1</button>
                        </td>

                        <td class="is-narrow is-vcentered py-3">
                            <th:block th:replace="~{fragments/dialogs :: thumb('item', ${item}, 'is-48x48')}"></th:block>
                        </td>

                        <td class="is-vcentered py-3">
                            <th:block th:replace="~{fragments/dialogs :: trigger('item', ${item})}"></th:block>
                            <p class="is-size-7 has-text-grey" th:if="${item.description}"
                               th:text="${item.description}">опис</p>
                        </td>

                        <td class="is-vcentered py-3" th:text="${item.date}">2026-01-01</td>
                        <td class="is-vcentered py-3" th:text="${item.placeName}">Місце</td>

                        <td class="is-vcentered py-3">
                            <div class="buttons are-small is-right is-flex-wrap-nowrap mb-0">
                                <a class="button is-light" th:if="${perms.can(scope, 'EDIT')}"
                                   th:href="@{${basePath} + '/' + ${item.id} + '/edit'}"
                                   title="Редагувати" aria-label="Редагувати">
                                    <span class="icon" aria-hidden="true"><i class="fa-solid fa-pen"></i></span>
                                </a>
                                <form th:if="${perms.can(scope, 'DELETE')}"
                                      th:action="@{${basePath} + '/' + ${item.id} + '/delete'}" method="post"
                                      onsubmit="return confirm('Видалити запис разом зі звʼязками в матчах?')">
                                    <button type="submit" class="button is-danger is-light"
                                            title="Видалити" aria-label="Видалити">
                                        <span class="icon" aria-hidden="true"><i class="fa-solid fa-trash"></i></span>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${items.empty}">
                        <td colspan="6" class="has-text-centered has-text-grey py-6">
                            <span class="icon is-large has-text-grey-lighter mb-3" aria-hidden="true">
                                <i class="fa-2x fa-solid fa-inbox"></i>
                            </span>
                            <p class="has-text-weight-medium">Записів ще немає</p>
                            <p class="is-size-7" th:if="${perms.can(scope, 'CREATE')}">
                                Натисни «Додати», щоб створити перший.
                            </p>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <nav th:replace="~{fragments/layout :: pager(${items}, ${basePath})}"></nav>
    </div>
</main>

<th:block th:each="item : ${items.content}">
    <th:block th:replace="~{fragments/dialogs :: dialogs('item', ${item}, ${basePath}, ${scope})}"></th:block>
</th:block>

</body>
</html>
