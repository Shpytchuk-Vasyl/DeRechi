<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="cell(row, page, filter)" th:id="'candidates-' + ${row.lost.id}">

    <p class="is-size-7 has-text-grey" th:unless="${row.hasCandidates()}">
        <span class="icon is-small has-text-grey" aria-hidden="true"><i class="fa-solid fa-inbox"></i></span> <span th:text="#{matches.noCandidates}">No candidates yet</span>
    </p>

    <table class="table is-fullwidth is-narrow candidates mb-0" th:if="${row.hasCandidates()}">
        <tbody>
        <tr th:each="candidate : ${row.candidates}">
            <td>
                <div class="media mb-0">
                    <div class="media-left">
                        <th:block th:replace="~{fragments/dialogs :: thumb('found', ${candidate.found}, 'is-48x48')}"></th:block>
                    </div>
                    <div class="media-content">
                        <p>
                            <span class="has-text-grey" th:text="'#' + ${candidate.found.id}">#2</span>
                            <th:block th:replace="~{fragments/dialogs :: trigger('found', ${candidate.found})}"></th:block>
                            <span class="tag is-light is-rounded"
                                  th:text="#{matches.rank(${#numbers.formatDecimal(candidate.matchOrder, 1, 3)})}">rank</span>
                        </p>
                        <p class="is-size-7 has-text-grey">
                            <span class="icon is-small has-text-grey" aria-hidden="true"><i class="fa-solid fa-calendar-days"></i></span> <span th:text="${fmt.date(candidate.found.date)}">2026-01-01</span> ·
                            <span class="icon is-small has-text-grey" aria-hidden="true"><i class="fa-solid fa-location-dot"></i></span> <span th:text="${candidate.found.placeName}">Місце</span>
                        </p>
                        <p class="is-size-7 has-text-success" th:if="${candidate.notified}">
                            <span class="icon is-small has-text-grey" aria-hidden="true"><i class="fa-solid fa-circle-check"></i></span>
                            <span>
                                <span th:text="#{matches.notified}">Notified</span>
                                <time class="local-datetime"
                                      th:datetime="${candidate.notifiedAt}"
                                      th:text="${candidate.notifiedAt}">2026-01-01</time>
                                (<span th:text="${candidate.notifiedBy}">admin</span>)
                            </span>
                        </p>
                    </div>
                </div>
            </td>
            <td class="has-text-right is-narrow">
                <form th:if="${perms.can('MATCH', 'NOTIFY')}"
                      th:action="@{/admin/matches/notify}" method="post">
                    <input type="hidden" name="lostItemId" th:value="${row.lost.id}">
                    <input type="hidden" name="foundItemId" th:value="${candidate.found.id}">
                    <input type="hidden" name="page" th:value="${page}">
                    <th:block th:replace="~{fragments/filters :: hidden(${filter})}"></th:block>
                    <button type="submit" class="button is-small"
                            th:classappend="${candidate.notified} ? 'is-light' : 'is-link'">
                        <span class="icon" aria-hidden="true">
                            <i class="fa-solid"
                               th:classappend="${candidate.notified} ? 'fa-rotate-right' : 'fa-bullhorn'"></i>
                        </span>
                        <span th:text="${candidate.notified} ? #{matches.notifyAgain} : #{matches.notify}">
                            Повідомити
                        </span>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <p class="mt-2 mb-0" th:if="${row.hasMore()}">
        <button type="button" class="button is-small is-light"
                th:hx-get="@{/admin/matches/{id}/candidates(id=${row.lost.id}, page=${page})} + ${filter.queryString()}"
                th:hx-target="'#candidates-' + ${row.lost.id}"
                hx-swap="outerHTML"
                th:data-error="#{matches.loadFailed}">
            <span class="icon" aria-hidden="true"><i class="fa-solid fa-chevron-down"></i></span>
            <span th:text="${plural.format('matches.showMore', row.hiddenCount())}">Show more</span>
        </button>
    </p>

    <th:block th:each="candidate : ${row.candidates}">
        <th:block th:replace="~{fragments/dialogs :: dialogs('found', ${candidate.found}, '/admin/found-items', 'FOUND_ITEM')}"></th:block>
    </th:block>
</div>

</body>
</html>
