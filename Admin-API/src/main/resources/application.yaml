spring:
  application:
    name: Admin-API

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/derechi
    username: derechi
    password: derechi

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  rabbitmq:
    host: localhost
    port: 5672
    username: derechi
    password: derechi

  thymeleaf:
    cache: false

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: derechi-admin
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email,roles
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/derechi
            user-name-attribute: preferred_username

derechi:
  admin:
    client-id: derechi-admin
    page-size: 20
  notifications:
    exchange: derechi.notifications
    routing-key: notification.match.found

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
