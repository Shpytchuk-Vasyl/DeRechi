spring:
  application:
    name: Admin-API

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/derechi
    username: derechi
    password: derechi
    hikari:
      connection-timeout: 30000

  transaction:
    default-timeout: 30s

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    always-use-message-format: true

  cache:
    type: caffeine
    cache-names: categories
    caffeine:
      spec: expireAfterWrite=1h

  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 14d
          cache-public: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      jakarta.persistence.query.timeout: 30000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: ${MINIO_ACCESS_KEY:derechi}
        secret-key: ${MINIO_SECRET_KEY:derechi123}
      s3:
        endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
        path-style-access-enabled: true

  rabbitmq:
    host: localhost
    port: 5672
    username: derechi
    password: derechi

  thymeleaf:
    cache: true

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: derechi-admin
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email,roles
        provider:
          keycloak:
            user-name-attribute: preferred_username

derechi:
  admin:
    client-id: derechi-admin
    page-size: 20
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:AIzaSyAEEnJ1r3fU7C33iy1slMkdA9mTOLnzzOk}
    region: UA
  countries:
    supported: [UA, PL, DE, FR]
    fallback: UA
  storage:
    bucket: derechi-files
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000/${derechi.storage.bucket}}
    max-size: 5MB
  notifications:
    exchange: derechi.notifications
    routing-key: notification.match.found
  archive:
    exchange: derechi.items

server:
  port: 8083
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
    min-response-size: 1KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

---
spring:
  config:
    activate:
      on-profile: "!docker"
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/derechi

---
spring:
  config:
    activate:
      on-profile: "docker"
  security:
    oauth2:
      client:
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_PUBLIC_URI:http://localhost:8180}/realms/derechi/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_URI:http://keycloak:8080}/realms/derechi/protocol/openid-connect/token
            jwk-set-uri: ${KEYCLOAK_URI:http://keycloak:8080}/realms/derechi/protocol/openid-connect/certs
            user-info-uri: ${KEYCLOAK_URI:http://keycloak:8080}/realms/derechi/protocol/openid-connect/userinfo
