#
#   docker compose up
#
name: derechi

services:

  postgres:
    build: ./docker/postgres
    image: derechi/postgis:17-3.5-uk
    container_name: derechi-postgres
    environment:
      POSTGRES_USER: derechi
      POSTGRES_PASSWORD: derechi
      POSTGRES_DB: derechi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U derechi"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: derechi-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: derechi
      RABBITMQ_DEFAULT_PASS: derechi
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI -> http://localhost:15672
      - "15692:15692"   # Prometheus -> http://localhost:15692/metrics
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-derechi.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: derechi-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"     # http://localhost:9090
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheusdata:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.2.1
    container_name: derechi-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"     # http://localhost:3000  (admin / admin)
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: derechi-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: derechi
      MINIO_ROOT_PASSWORD: derechi123
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # Console -> http://localhost:9001  (derechi / derechi123)
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

