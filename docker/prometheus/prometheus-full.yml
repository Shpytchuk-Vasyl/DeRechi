global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: derechi

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: derechi-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["getaway:9080"]
        labels: { application: Getaway }
      - targets: ["client-api:9082"]
        labels: { application: Client-API }
      - targets: ["admin-api:9083"]
        labels: { application: Admin-API }
      - targets: ["worker:9085"]
        labels: { application: Worker }
      - targets: ["notification:9084"]
        labels: { application: Notification }

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
