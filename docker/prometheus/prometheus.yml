global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: derechi

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: derechi-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8761"]
        labels: { application: Discovery }
      - targets: ["host.docker.internal:8080"]
        labels: { application: Getaway }
      - targets: ["host.docker.internal:8082"]
        labels: { application: Client-API }
      - targets: ["host.docker.internal:8083"]
        labels: { application: Admin-API }
      - targets: ["host.docker.internal:8085"]
        labels: { application: Worker }
      - targets: ["host.docker.internal:8084"]
        labels: { application: Notification }

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
