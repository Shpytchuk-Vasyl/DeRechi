global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: derechi

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Сервіси запускаються в IDE на хості, тому host.docker.internal, а не імена контейнерів.
  # Якщо колись запакуєш сервіси в compose — заміни на <service-name>:<port>.
  - job_name: derechi-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8761"]
        labels: { application: Discovery }
      - targets: ["host.docker.internal:8080"]
        labels: { application: Getaway }
      - targets: ["host.docker.internal:8081"]
        labels: { application: Auth }
      - targets: ["host.docker.internal:8082"]
        labels: { application: Client-API }
      - targets: ["host.docker.internal:8083"]
        labels: { application: Admin-API }
      - targets: ["host.docker.internal:8085"]
        labels: { application: Automatic-Search }
      # Notification тимчасово вимкнений (виключений з <modules>)
      # - targets: ["host.docker.internal:8084"]
      #   labels: { application: Notification }

  # MinIO віддає власні метрики (кількість обʼєктів, трафік, стан дисків)
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
