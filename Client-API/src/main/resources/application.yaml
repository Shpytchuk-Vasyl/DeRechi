spring:
  application:
    name: Client-API

  # cloud:
  #   inetutils:
  #     preferred-networks: 192.168.43

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:derechi}
    username: ${POSTGRES_USER:derechi}
    password: ${POSTGRES_PASSWORD:derechi}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:derechi}
    password: ${RABBITMQ_PASSWORD:derechi}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}
    connection-timeout: 4s

  graphql:
    schema:
      locations: classpath:graphql/
      printer:
        enabled: true
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:false}

server:
  port: 8082

management:
  server:
    port: ${MANAGEMENT_PORT:9082}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

derechi:
  site:
    url: ${DERECHI_SITE_URL:http://localhost:3000}
  countries:
    # ISO 3166-1 alpha-2;
    supported: [UA, PL, DE, FR]
    fallback: UA
  claims:
    exchange: derechi.items
    unlock-limit: 1
    unlock-window: P7D
  events:
    buffer-capacity: 10000
    batch-size: 20
    flush-interval: 5s
  fourthwall:
    api-url: https://api.fourthwall.com/open-api/v1.0
    shop-url: ${FOURTHWALL_SHOP_URL:https://derechi-shop.fourthwall.com}
    username: ${FOURTHWALL_API_USERNAME:dev-user}
    password: ${FOURTHWALL_API_PASSWORD:dev-password}
    webhook-secret: ${FOURTHWALL_WEBHOOK_SECRET:dev-secret}
    price: 1
    product-name: "Author's phone number (%s)"
    product-description: "After the payment, the phone number of the author of the notice is sent by SMS and email to the contacts you left in your response on DeRechi. Nothing is shipped."
    connect-timeout: 3s
    read-timeout: 10s
    product-image:
      url: ${FOURTHWALL_PRODUCT_IMAGE_URL:https://cdn.fourthwall.com/customizations/sh_b033e02b-f108-4a5b-8703-df9ac3ebf4c9/652a19a8-9532-4902-9e55-0574a68ec98a.png}
      width: 600
      height: 800
    product-file:
      name: derechi-phone-number.txt
      text: |
        DeRechi: the phone number of the author of the notice

        Thank you for the payment. The phone number of the author of the notice is sent by SMS and email
        to the contacts you left in your response on DeRechi. Nothing else is shipped.

        If the number has not arrived within 24 hours, you will get the payment back.
