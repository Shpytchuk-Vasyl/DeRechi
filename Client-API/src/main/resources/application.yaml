spring:
  application:
    name: Client-API

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/derechi
    username: derechi
    password: derechi

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  rabbitmq:
    host: localhost
    port: 5672
    username: derechi
    password: derechi

  graphql:
    schema:
      locations: classpath:graphql/
      printer:
        enabled: true
    graphiql:
      enabled: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

derechi:
  countries:
    # ISO 3166-1 alpha-2;
    supported: [UA, PL, DE, FR]
    fallback: UA
