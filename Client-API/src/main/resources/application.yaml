spring:
  application:
    name: Client-API

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/derechi
    username: derechi
    password: derechi

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  rabbitmq:
    host: localhost
    port: 5672
    username: derechi
    password: derechi

  graphql:
    schema:
      locations: classpath:graphql/
      printer:
        enabled: true
    graphiql:
      enabled: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

derechi:
  countries:
    # ISO 3166-1 alpha-2;
    supported: [UA, PL, DE, FR]
    fallback: UA
  claims:
    exchange: derechi.items
  fourthwall:
    api-url: https://api.fourthwall.com/open-api/v1.0
    shop-url: ${FOURTHWALL_SHOP_URL:https://derechi-shop.fourthwall.com}
    username: ${FOURTHWALL_API_USERNAME:dev-user}
    password: ${FOURTHWALL_API_PASSWORD:dev-password}
    webhook-secret: ${FOURTHWALL_WEBHOOK_SECRET:dev-secret}
    price: 1
    product-name: "Author's phone number (%s)"
    product-description: "After the payment, the phone number of the author of the notice is sent by SMS and email to the contacts you left in your response on DeRechi. Nothing is shipped."
