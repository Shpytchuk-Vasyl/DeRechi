spring:
  application:
    name: Auth

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/derechi
    username: derechi
    password: derechi

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  # міграції веде модуль DB-postgres і накочує їх вручну
  flyway:
    enabled: false

  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:8081

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
