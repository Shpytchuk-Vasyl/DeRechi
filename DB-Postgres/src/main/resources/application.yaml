# Модуль запускається вручну (з IDEA або ./mvnw -pl DB-Postgres spring-boot:run)
# для генерації схеми з JPA-ентіті. Web-стартера немає, тож застосунок
# відпрацьовує і одразу завершується.
spring:
  application:
    name: DB-Postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/derechi
    username: derechi
    password: derechi

  jpa:
    open-in-view: false
    # у режимі генерації скрипта Hibernate не ходить у БД,
    # тому діалект треба вказати явно — інакше "Unable to determine Dialect"
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # схему змінюють тільки міграції, Hibernate до БД не торкається
      ddl-auto: none
    properties:
      jakarta.persistence.schema-generation:
        scripts:
          action: create
          create-source: metadata
          create-target: target/generated-schema.sql

  # під час генерації міграції накатувати не треба:
  # спершу дивимось, що згенерував Hibernate, потім оформлюємо як V__*.sql
  flyway:
    enabled: false
    locations: classpath:db/migration
