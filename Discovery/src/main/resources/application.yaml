spring:
  application:
    name: Discovery

server:
  port: 8761

eureka:
  client:
    # сам реєстр себе не реєструє і реєстр не тягне
    register-with-eureka: false
    fetch-registry: false
  server:
    # на деві інстанси піднімаються/падають часто — self-preservation тільки заважає
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
