spring:
  application:
    name: Notification

  threads:
    virtual:
      enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:derechi}
    password: ${RABBITMQ_PASSWORD:derechi}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3

derechi:
  notification:
    queue: notification.events
  sms-fly:
    api-key: ${SMS_FLY_API_KEY:}
    api-url: ${SMS_FLY_API_URL:https://sms-fly.ua/api/v2/api.php}
    source: ${SMS_FLY_SOURCE:DeRechi}
    ttl: 24h
    connect-timeout: 3s
    read-timeout: 10s

notify:
  deduplication:
    enabled: true
    ttl: 1h
  retry:
    strategy: exponential
    max-attempts: 3
  tracking:
    enabled: true
  channels:
    email:
      host: ${NOTIFY_EMAIL_HOST:localhost}
      port: ${NOTIFY_EMAIL_PORT:1025}
      username: ${NOTIFY_EMAIL_USERNAME:}
      password: ${NOTIFY_EMAIL_PASSWORD:}
      from: ${NOTIFY_EMAIL_FROM:no-reply@derechi.local}
      from-name: DeRechi
      # only for local development, in production use TLS
      # tls: false

server:
  port: 8084

management:
  server:
    port: ${MANAGEMENT_PORT:9084}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
