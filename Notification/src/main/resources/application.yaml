spring:
  application:
    name: Notification

  threads:
    virtual:
      enabled: true

  rabbitmq:
    host: localhost
    port: 5672
    username: derechi
    password: derechi
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3

derechi:
  notification:
    queue: notification.events

notify:
  deduplication:
    enabled: true
    ttl: 1h
  retry:
    strategy: exponential
    max-attempts: 3
  tracking:
    enabled: true
  channels:
    email:
      host: ${NOTIFY_EMAIL_HOST:localhost}
      port: ${NOTIFY_EMAIL_PORT:1025}
      username: ${NOTIFY_EMAIL_USERNAME:}
      password: ${NOTIFY_EMAIL_PASSWORD:}
      from: no-reply@derechi.local
      from-name: DeRechi
      tls: false

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
