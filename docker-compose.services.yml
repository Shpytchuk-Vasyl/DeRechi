#
#   docker compose -f docker-compose.yml -f docker-compose.services.yml up -d --build
#   docker compose --env-file env.prod -f docker-compose.yml -f docker-compose.services.yml up -d --build
#
# The defaults are the local values. Addresses are as the containers see each other inside
# the compose network (postgres, rabbitmq, client-api), not localhost.
#
name: derechi

x-service-base: &service-base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: ${SERVICE_MEMORY:-512m}

x-postgres: &postgres
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-derechi}
  POSTGRES_USER: ${POSTGRES_USER:-derechi}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-derechi}

x-rabbitmq: &rabbitmq
  RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USER: ${RABBITMQ_USER:-derechi}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-derechi}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
  RABBITMQ_SSL: ${RABBITMQ_SSL:-false}

x-jvm: &jvm
  JAVA_OPTS: >-
    ${JAVA_OPTS:--Xms64m -Xmx256m
    -XX:MaxMetaspaceSize=192m
    -XX:ReservedCodeCacheSize=34m
    -XX:MaxDirectMemorySize=34m
    -XX:-UseG1GC -XX:+UseSerialGC}

services:

  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus-full.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle

  caddy:
    environment:
      CLIENT_API_URI: ${CLIENT_API_URI:-http://client-api:8082}

  db-postgres:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: DB-Postgres
    container_name: derechi-db-postgres
    restart: "no"
    environment:
      <<: [*jvm, *postgres]
    depends_on:
      postgres:
        condition: service_healthy

  client-api:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: Client-API
    container_name: derechi-client-api
    ports:
      - "8082:8082"
    environment:
      <<: [*jvm, *postgres, *rabbitmq]
      FOURTHWALL_SHOP_URL: ${FOURTHWALL_SHOP_URL:-https://derechi-shop.fourthwall.com}
      FOURTHWALL_API_USERNAME: ${FOURTHWALL_API_USERNAME:-dev-user}
      FOURTHWALL_API_PASSWORD: ${FOURTHWALL_API_PASSWORD:-dev-password}
      FOURTHWALL_WEBHOOK_SECRET: ${FOURTHWALL_WEBHOOK_SECRET:-dev-secret}
      FOURTHWALL_PRODUCT_IMAGE_URL: ${FOURTHWALL_PRODUCT_IMAGE_URL:-https://cdn.fourthwall.com/customizations/sh_b033e02b-f108-4a5b-8703-df9ac3ebf4c9/652a19a8-9532-4902-9e55-0574a68ec98a.png}
      DERECHI_SITE_URL: ${DERECHI_SITE_URL:-http://localhost:3000}
    depends_on:
      db-postgres:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully

  admin-api:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: Admin-API
    container_name: derechi-admin-api
    ports:
      - "8083:8083"
    environment:
      <<: [*jvm, *postgres, *rabbitmq]
      SPRING_PROFILES_ACTIVE: docker
      KEYCLOAK_URI: ${KEYCLOAK_URI:-http://keycloak:8080}
      KEYCLOAK_PUBLIC_URI: ${KEYCLOAK_PUBLIC_URI:-http://localhost:8180}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET: ${MINIO_BUCKET:-derechi-files}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/derechi-files}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-derechi-app}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-derechi-app-secret}
      GOOGLE_MAPS_API_KEY:
    depends_on:
      db-postgres:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  worker:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: Worker
    container_name: derechi-worker
    ports:
      - "8085:8085"
    environment:
      <<: [*jvm, *postgres, *rabbitmq]
      DERECHI_SITE_URL: ${DERECHI_SITE_URL:-http://localhost:3000}
    depends_on:
      db-postgres:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully

  notification:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: Notification
    container_name: derechi-notification
    ports:
      - "8084:8084"
    environment:
      <<: [*jvm, *rabbitmq]
      NOTIFY_EMAIL_HOST: ${NOTIFY_EMAIL_HOST:-mailpit}
      NOTIFY_EMAIL_PORT: ${NOTIFY_EMAIL_PORT:-1025}
      NOTIFY_EMAIL_USERNAME: ${NOTIFY_EMAIL_USERNAME:-}
      NOTIFY_EMAIL_PASSWORD: ${NOTIFY_EMAIL_PASSWORD:-}
      NOTIFY_EMAIL_FROM: ${NOTIFY_EMAIL_FROM:-no-reply@derechi.local}
      SMS_FLY_API_KEY: ${SMS_FLY_API_KEY:-}
      SMS_FLY_API_URL: ${SMS_FLY_API_URL:-https://sms-fly.ua/api/v2/api.php}
      SMS_FLY_SOURCE: ${SMS_FLY_SOURCE:-DeRechi}
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
        required: false

  #   docker compose -f docker-compose.yml -f docker-compose.services.yml run --rm -it ingest --login
  ingest:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      target: ingest
      args:
        MODULE: Ingest
    container_name: derechi-ingest
    ports:
      - "8086:8086"
    deploy:
      resources:
        limits:
          memory: ${INGEST_MEMORY:-1g}
    volumes:
      - tdlib-data:/app/tdlib
    environment:
      <<: [*postgres, *rabbitmq]
      # Tesseract, ONNX Runtime and TDLib live outside the heap: keep -Xmx well below the memory limit
      JAVA_OPTS: ${INGEST_JAVA_OPTS:--Xms64m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:-UseG1GC -XX:+UseSerialGC --enable-native-access=ALL-UNNAMED}
      TDLIB_DATA_DIR: /app/tdlib
      DERECHI_SITE_URL: ${DERECHI_SITE_URL:-http://localhost:3000}
      DERECHI_API_URI: ${DERECHI_API_URI:-http://caddy:8080}
      DERECHI_API_TIMEOUT: ${DERECHI_API_TIMEOUT:-PT15S}
      DERECHI_API_MAX_ATTEMPTS: ${DERECHI_API_MAX_ATTEMPTS:-3}
      DERECHI_API_RETRY_DELAY: ${DERECHI_API_RETRY_DELAY:-PT1S}
      DERECHI_API_REFERENCE_TTL: ${DERECHI_API_REFERENCE_TTL:-1h}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET: ${MINIO_BUCKET:-derechi-files}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-derechi-app}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-derechi-app-secret}
      MINIO_MAX_UPLOAD: ${MINIO_MAX_UPLOAD:-5MB}
      INGEST_PUBLISHERS: ${INGEST_PUBLISHERS:-}
      INGEST_HASH_KEY: ${INGEST_HASH_KEY:-dev-hash-key-change-me}
      INGEST_DUPLICATE_WINDOW: ${INGEST_DUPLICATE_WINDOW:-P14D}
      INGEST_MAX_PHOTOS: ${INGEST_MAX_PHOTOS:-3}
      INGEST_MAX_AGE: ${INGEST_MAX_AGE:-P30D}
      INGEST_SITE_LOCALE: ${INGEST_SITE_LOCALE:-uk}
      INGEST_MIN_CONFIDENCE: ${INGEST_MIN_CONFIDENCE:-0.6}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-0}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
      TELEGRAM_FOLDER: ${TELEGRAM_FOLDER:-DeRechi}
      TELEGRAM_CHATS: ${TELEGRAM_CHATS:-}
      TELEGRAM_DEFAULT_REGION: ${TELEGRAM_DEFAULT_REGION:-UA}
      TELEGRAM_DEFAULT_LOCALE: ${TELEGRAM_DEFAULT_LOCALE:-uk}
      TELEGRAM_ALBUM_WAIT: ${TELEGRAM_ALBUM_WAIT:-PT3S}
      TELEGRAM_FOLDER_REFRESH: ${TELEGRAM_FOLDER_REFRESH:-PT10M}
      TELEGRAM_CATCH_UP_MAX_AGE: ${TELEGRAM_CATCH_UP_MAX_AGE:-PT48H}
      TELEGRAM_CATCH_UP_MAX_MESSAGES: ${TELEGRAM_CATCH_UP_MAX_MESSAGES:-200}
      FACEBOOK_COOKIES: ${FACEBOOK_COOKIES:-}
      FACEBOOK_GROUPS: ${FACEBOOK_GROUPS:-}
      FACEBOOK_USER_AGENT: ${FACEBOOK_USER_AGENT:-}
      FACEBOOK_POLL_EVERY: ${FACEBOOK_POLL_EVERY:-PT1H}
      FACEBOOK_POLL_JITTER: ${FACEBOOK_POLL_JITTER:-PT20M}
      FACEBOOK_REQUEST_PAUSE: ${FACEBOOK_REQUEST_PAUSE:-PT10S}
      FACEBOOK_MAX_PAGES: ${FACEBOOK_MAX_PAGES:-10}
      FACEBOOK_CATCH_UP_MAX_AGE: ${FACEBOOK_CATCH_UP_MAX_AGE:-PT18H}
      FACEBOOK_TIMEOUT: ${FACEBOOK_TIMEOUT:-PT30S}
      FACEBOOK_ACTIVE_HOURS: ${FACEBOOK_ACTIVE_HOURS:-}
      TELEGRAM_BOT_API_URL: ${TELEGRAM_BOT_API_URL:-https://api.telegram.org}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_PUBLISH_CHAT: ${TELEGRAM_PUBLISH_CHAT:-}
      TELEGRAM_PUBLISH_LOCALE: ${TELEGRAM_PUBLISH_LOCALE:-uk}
      TELEGRAM_BOT_TIMEOUT: ${TELEGRAM_BOT_TIMEOUT:-PT30S}
      TELEGRAM_BOT_MAX_ATTEMPTS: ${TELEGRAM_BOT_MAX_ATTEMPTS:-3}
      TELEGRAM_BOT_RETRY_DELAY: ${TELEGRAM_BOT_RETRY_DELAY:-PT3S}
      OPENROUTER_URL: ${OPENROUTER_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-3.1-flash-lite}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-qwen/qwen3.5-flash-02-23}
      OPENROUTER_ROUTING: ${OPENROUTER_ROUTING:-true}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-PT60S}
      OPENROUTER_MAX_ATTEMPTS: ${OPENROUTER_MAX_ATTEMPTS:-3}
      OPENROUTER_RETRY_DELAY: ${OPENROUTER_RETRY_DELAY:-PT1S}
      OPENROUTER_DAILY_LIMIT: ${OPENROUTER_DAILY_LIMIT:-300}
      GOOGLE_PLACES_API: ${GOOGLE_PLACES_API:-LEGACY}
      GOOGLE_PLACES_URL: ${GOOGLE_PLACES_URL:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_PLACES_TIMEOUT: ${GOOGLE_PLACES_TIMEOUT:-PT10S}
      GOOGLE_PLACES_MAX_ATTEMPTS: ${GOOGLE_PLACES_MAX_ATTEMPTS:-3}
      GOOGLE_PLACES_RETRY_DELAY: ${GOOGLE_PLACES_RETRY_DELAY:-PT1S}
      REDACTION_OCR_LANGUAGES: ${REDACTION_OCR_LANGUAGES:-ukr+eng}
      # unset unless overridden: the default list lives in application.yaml only
      REDACTION_DOCUMENT_KEYWORDS:
      REDACTION_FACE_MODEL: ${REDACTION_FACE_MODEL:-classpath:models/face_detection_yunet_2023mar.onnx}
      REDACTION_FACE_SCORE: ${REDACTION_FACE_SCORE:-0.6}
      REDACTION_DOCUMENT_MODE: ${REDACTION_DOCUMENT_MODE:-PARTIAL}
    depends_on:
      db-postgres:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully

volumes:
  tdlib-data:    # TDLib session of Ingest; losing it means another --login
