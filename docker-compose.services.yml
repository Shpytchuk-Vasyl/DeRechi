#
#   docker compose -f docker-compose.yml -f docker-compose.services.yml up -d --build
#   docker compose --env-file env.prod -f docker-compose.yml -f docker-compose.services.yml up -d --build
#
# The defaults are the local values. Addresses are as the containers see each other inside
# the compose network (postgres, rabbitmq, client-api), not localhost.
#
name: derechi

x-service-base: &service-base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped

x-postgres: &postgres
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-derechi}
  POSTGRES_USER: ${POSTGRES_USER:-derechi}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-derechi}

x-rabbitmq: &rabbitmq
  RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USER: ${RABBITMQ_USER:-derechi}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-derechi}

x-jvm: &jvm
  JAVA_OPTS: >-
    ${JAVA_OPTS:--Xms64m -Xmx256m
    -XX:MaxMetaspaceSize=192m
    -XX:ReservedCodeCacheSize=34m
    -XX:MaxDirectMemorySize=34m
    -XX:-UseG1GC -XX:+UseSerialGC}

services:

  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus-full.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle

  keycloak:
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-derechi}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-derechi}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URI:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

  getaway:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: Getaway
    container_name: derechi-getaway
    ports:
      - "8080:8080"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *jvm
      CLIENT_API_URI: ${CLIENT_API_URI:-http://client-api:8082}
      KEYCLOAK_URI: ${KEYCLOAK_URI:-http://keycloak:8080}
      MINIO_URI: ${MINIO_URI:-http://minio:9000}
      WEB_ORIGIN_PATTERNS: ${WEB_ORIGIN_PATTERNS:-http://localhost:[*],http://127.0.0.1:[*],http://192.168.*:[*],http://10.*:[*]}

  client-api:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: Client-API
    container_name: derechi-client-api
    ports:
      - "8082:8082"
    environment:
      <<: [*jvm, *postgres, *rabbitmq]
      FOURTHWALL_SHOP_URL: ${FOURTHWALL_SHOP_URL:-https://derechi-shop.fourthwall.com}
      FOURTHWALL_API_USERNAME: ${FOURTHWALL_API_USERNAME:-dev-user}
      FOURTHWALL_API_PASSWORD: ${FOURTHWALL_API_PASSWORD:-dev-password}
      FOURTHWALL_WEBHOOK_SECRET: ${FOURTHWALL_WEBHOOK_SECRET:-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully

  admin-api:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: Admin-API
    container_name: derechi-admin-api
    ports:
      - "8083:8083"
    environment:
      <<: [*jvm, *postgres, *rabbitmq]
      SPRING_PROFILES_ACTIVE: docker
      KEYCLOAK_URI: ${KEYCLOAK_URI:-http://keycloak:8080}
      KEYCLOAK_PUBLIC_URI: ${KEYCLOAK_PUBLIC_URI:-http://localhost:8180}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:8080/files}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-derechi}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-derechi123}
      GOOGLE_MAPS_API_KEY:
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  worker:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: Worker
    container_name: derechi-worker
    ports:
      - "8085:8085"
    environment:
      <<: [*jvm, *postgres, *rabbitmq]
      DERECHI_SITE_URL: ${DERECHI_SITE_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully

  notification:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: Notification
    container_name: derechi-notification
    ports:
      - "8084:8084"
    environment:
      <<: [*jvm, *rabbitmq]
      NOTIFY_EMAIL_HOST: ${NOTIFY_EMAIL_HOST:-mailpit}
      NOTIFY_EMAIL_PORT: ${NOTIFY_EMAIL_PORT:-1025}
      NOTIFY_EMAIL_USERNAME: ${NOTIFY_EMAIL_USERNAME:-}
      NOTIFY_EMAIL_PASSWORD: ${NOTIFY_EMAIL_PASSWORD:-}
      NOTIFY_EMAIL_FROM: ${NOTIFY_EMAIL_FROM:-no-reply@derechi.local}
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
