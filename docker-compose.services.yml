#
#   docker compose -f docker-compose.yml -f docker-compose.services.yml up -d --build
#
name: derechi

x-service-base: &service-base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    discovery:
      condition: service_started

x-eureka: &eureka
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery:8761/eureka

x-postgres: &postgres
  SPRING_DATASOURCE_USERNAME: derechi
  SPRING_DATASOURCE_PASSWORD: derechi

x-rabbitmq: &rabbitmq
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: 5672
  SPRING_RABBITMQ_USERNAME: derechi
  SPRING_RABBITMQ_PASSWORD: derechi

services:

  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus-full.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle

  keycloak:
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: derechi
      KC_DB_PASSWORD: derechi
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

  discovery:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: Discovery
    container_name: derechi-discovery
    restart: unless-stopped
    ports:
      - "8761:8761"

  getaway:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: Getaway
    container_name: derechi-getaway
    ports:
      - "8080:8080"
    depends_on:
      discovery:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      <<: *eureka
      KEYCLOAK_URI: http://keycloak:8080
      MINIO_URI: http://minio:9000

  client-api:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: Client-API
    container_name: derechi-client-api
    ports:
      - "8082:8082"
    environment:
      <<: [*eureka, *postgres, *rabbitmq]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/derechi
    depends_on:
      discovery:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  admin-api:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: Admin-API
    container_name: derechi-admin-api
    ports:
      - "8083:8083"
    environment:
      <<: [*eureka, *postgres, *rabbitmq]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/derechi
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8180/realms/derechi}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:8080/files}
    depends_on:
      discovery:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  automatic-search:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: Automatic-Search
    container_name: derechi-automatic-search
    ports:
      - "8085:8085"
    environment:
      <<: [*eureka, *postgres, *rabbitmq]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/derechi
    depends_on:
      discovery:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: Notification
    container_name: derechi-notification
    ports:
      - "8084:8084"
    environment:
      <<: [*eureka, *rabbitmq]
      NOTIFY_EMAIL_HOST: mailpit
    depends_on:
      discovery:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
