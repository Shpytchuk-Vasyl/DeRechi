claim.lost.subject=DeRechi: Jemand hat Ihren Gegenstand gefunden
claim.lost.body=Jemand gibt an, Ihren Gegenstand „{0}“ gefunden zu haben, und möchte ihn zurückgeben. Kontakt:\nTelefon {1}\nE-Mail {2}\nMessenger: {3}\n\nAnzeige: {4}\n\nTreffen Sie sich an einem belebten Ort und zahlen Sie niemals etwas im Voraus. DeRechi verlangt nie Geld.
claim.found.subject=DeRechi: Jemand vermisst den Gegenstand, den Sie gefunden haben
claim.found.body=Jemand erkennt den von Ihnen gefundenen Gegenstand „{0}“ als den eigenen wieder und möchte ihn zurückbekommen. Kontakt:\nTelefon {1}\nE-Mail {2}\nMessenger: {3}\n\nAnzeige: {4}\n\nFragen Sie vor der Übergabe nach Details, die auf dem Foto nicht zu sehen sind.
claim.reminder.author.subject=DeRechi: Ist „{0}“ wieder zurück?
claim.reminder.author.body=Wir haben Ihnen die Kontaktdaten einer Person weitergegeben, die auf Ihre Anzeige „{0}“ reagiert hat. Wenn der Gegenstand zurückgegeben wurde, schließen Sie die Anzeige hier: {1}\n\nWenn niemand die Rückgabe bestätigt, wird die Anzeige etwa eine Woche nach der letzten Rückmeldung archiviert.
claim.reminder.claimant.subject=DeRechi: Wurde „{0}“ zurückgegeben?
claim.reminder.claimant.body=Sie haben auf die Anzeige „{0}“ reagiert. Wurde der Gegenstand zurückgegeben? Wenn ja, schließen Sie die Anzeige hier: {1}\n\nWenn niemand die Rückgabe bestätigt, wird die Anzeige etwa eine Woche nach der letzten Rückmeldung archiviert.
claim.messengers.none=keine
