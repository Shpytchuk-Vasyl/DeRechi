spring:
  application:
    name: Automatic-Search

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/derechi
    username: derechi
    password: derechi

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  rabbitmq:
    host: localhost
    port: 5672
    username: derechi
    password: derechi
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
