claim.lost.subject=DeRechi: вашу річ знайдено
claim.lost.body=Хтось повідомляє: вашу річ «{0}» знайдено, і її хочуть повернути. Контакти:\nтелефон {1}\nпошта {2}\nмесенджери: {3}\n\nОголошення: {4}\n\nЗустрічайтеся в людному місці й ніколи нічого не сплачуйте наперед. DeRechi ніколи не просить грошей.
claim.found.subject=DeRechi: знайдену вами річ шукає власник
claim.found.body=Хтось вважає річ «{0}», яку ви знайшли, своєю і хоче отримати її назад. Контакти:\nтелефон {1}\nпошта {2}\nмесенджери: {3}\n\nОголошення: {4}\n\nПерш ніж віддати річ, розпитайте про деталі, яких не видно на фото.
claim.reminder.author.subject=DeRechi: «{0}» уже повернуто власнику?
claim.reminder.author.body=Учора ми передали вам контакти людини, яка відгукнулася на ваше оголошення «{0}». Якщо річ уже повернуто власнику, закрийте оголошення тут: {1}\n\nЯкщо ніхто не підтвердить повернення, оголошення перенесуть в архів приблизно через тиждень після останнього відгуку.
claim.reminder.claimant.subject=DeRechi: «{0}» уже повернуто?
claim.reminder.claimant.body=Два дні тому ви відгукнулися на оголошення «{0}». Чи повернуто річ? Якщо так, закрийте оголошення тут: {1}\n\nЯкщо ніхто не підтвердить повернення, оголошення перенесуть в архів приблизно через тиждень після останнього відгуку.
claim.messengers.none=немає
