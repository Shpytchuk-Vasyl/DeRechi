spring:
  application:
    name: Getaway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: keycloak
              uri: http://localhost:8180
              predicates:
                - Path=/realms/**,/resources/**
            - id: client-api
              uri: lb://CLIENT-API
              predicates:
                - Path=/graphql/**,/api/client/**
            - id: admin-api
              uri: lb://ADMIN-API
              predicates:
                - Path=/api/admin/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      show-details: always
