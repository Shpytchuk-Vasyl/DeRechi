spring:
  application:
    name: Getaway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: ${WEB_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*:[*],http://10.*:[*]}
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
          routes:
            - id: keycloak
              uri: ${KEYCLOAK_URI:http://localhost:8180}
              predicates:
                - Path=/realms/**,/resources/**
            - id: client-api
              uri: lb://CLIENT-API
              predicates:
                - Path=/graphql/**,/graphiql/**,/api/client/**

            - id: files-upload
              uri: ${MINIO_URI:http://localhost:9000}
              predicates:
                - Path=/${MINIO_BUCKET:derechi-files}/**
                - Method=PUT
              filters:
                - PreserveHostHeader
                - name: DedupeResponseHeader
                  args:
                    name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
                    strategy: RETAIN_UNIQUE
                - name: RequestSize
                  args:
                    maxSize: ${MINIO_MAX_UPLOAD:5MB}

            - id: files
              uri: ${MINIO_URI:http://localhost:9000}
              predicates:
                - Path=/files/**
                - Method=GET
              filters:
                - RewritePath=/files/(?<key>.*), /${MINIO_BUCKET:derechi-files}/$\{key}
                - name: AddResponseHeader
                  args:
                    name: Cache-Control
                    value: "public, max-age=31536000, immutable"

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      show-details: always
