claim.lost.subject=DeRechi : quelqu''un a trouvé votre objet
claim.lost.body=Bonjour,\n\nQuelqu''un indique avoir trouvé votre objet « {0} » et souhaite vous le rendre.\n\nSes coordonnées :\n  Téléphone : {1}\n  E-mail : {2}\n  Messageries : {3}\n\nAnnonce : {4}\n\nDonnez-vous rendez-vous dans un lieu fréquenté et ne payez jamais rien à l''avance. DeRechi ne demande jamais d''argent.\n\n– L''équipe DeRechi
claim.found.subject=DeRechi : le propriétaire de l''objet que vous avez trouvé s''est manifesté
claim.found.body=Bonjour,\n\nQuelqu''un indique que l''objet « {0} » que vous avez trouvé lui appartient et souhaite le récupérer.\n\nSes coordonnées :\n  Téléphone : {1}\n  E-mail : {2}\n  Messageries : {3}\n\nAnnonce : {4}\n\n– L''équipe DeRechi
claim.reminder.author.subject=DeRechi : l''objet « {0} » est-il revenu à son propriétaire ?
claim.reminder.author.body=Nous vous avons transmis les coordonnées d''une personne qui a répondu à votre annonce « {0} ». Si l''objet a été rendu, fermez l''annonce ici : {1}\n\nSans confirmation, l''annonce sera archivée environ une semaine après la dernière réponse.
claim.reminder.claimant.subject=DeRechi : l''objet « {0} » a-t-il été rendu ?
claim.reminder.claimant.body=Vous avez répondu à l''annonce « {0} ». L''objet a-t-il été rendu ? Si oui, fermez l''annonce ici : {1}\n\nSans confirmation, l''annonce sera archivée environ une semaine après la dernière réponse.
claim.unlocked.subject=DeRechi : numéro de téléphone pour l''annonce « {0} »
claim.unlocked.body=Merci de soutenir DeRechi. Le numéro de téléphone de la personne qui a publié l''annonce « {0} » : {1}\n\nDonnez-vous rendez-vous dans un lieu fréquenté et ne payez jamais rien à l''avance.
