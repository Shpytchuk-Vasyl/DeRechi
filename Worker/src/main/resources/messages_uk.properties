claim.lost.subject=DeRechi: вашу річ знайдено
claim.lost.body=Вітаємо!\n\nЛюдина повідомляє, що знайшла вашу річ «{0}», і хоче її повернути.\n\nКонтакти:\n  Телефон: {1}\n  Пошта: {2}\n  Месенджери: {3}\n\nОголошення: {4}\n\nЗустрічайтеся в людному місці й ніколи нічого не сплачуйте наперед. DeRechi ніколи не просить грошей.\n\n— Команда DeRechi
claim.found.subject=DeRechi: знайдену вами річ шукає власник
claim.found.body=Вітаємо!\n\nЛюдина вважає річ «{0}», яку ви знайшли, своєю і хоче отримати її назад.\n\nКонтакти:\n  Телефон: {1}\n  Пошта: {2}\n  Месенджери: {3}\n\nОголошення: {4}\n\n— Команда DeRechi
claim.reminder.author.subject=DeRechi: «{0}» уже повернуто власнику?
claim.reminder.author.body=Ми передали вам контакти людини, яка відгукнулася на ваше оголошення «{0}». Якщо річ уже повернуто власнику, закрийте оголошення тут: {1}\n\nЯкщо ніхто не підтвердить повернення, оголошення перенесуть в архів приблизно через тиждень після останнього відгуку.
claim.reminder.claimant.subject=DeRechi: «{0}» уже повернуто?
claim.reminder.claimant.body=Ви відгукнулися на оголошення «{0}». Чи повернуто річ? Якщо так, закрийте оголошення тут: {1}\n\nЯкщо ніхто не підтвердить повернення, оголошення перенесуть в архів приблизно через тиждень після останнього відгуку.
claim.unlocked.subject=DeRechi: номер автора оголошення «{0}»
claim.unlocked.body=Дякуємо, що підтримуєте DeRechi. Номер телефону людини, яка розмістила оголошення «{0}»: {1}\n\nЗустрічайтеся в людному місці й ніколи нічого не сплачуйте наперед.
claim.messengers.none=немає
