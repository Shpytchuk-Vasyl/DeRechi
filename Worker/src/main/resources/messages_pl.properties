claim.lost.subject=DeRechi: Twoja rzecz została odnaleziona
claim.lost.body=Ktoś zgłasza, że Twoja rzecz „{0}” została odnaleziona, i chce ją zwrócić. Kontakt:\ntelefon {1}\ne-mail {2}\nkomunikatory: {3}\n\nOgłoszenie: {4}\n\nUmów się w ruchliwym miejscu i nigdy nie płać niczego z góry. DeRechi nigdy nie prosi o pieniądze.
claim.found.subject=DeRechi: znaleziona przez Ciebie rzecz ma właściciela
claim.found.body=Ktoś uważa znalezioną przez Ciebie rzecz „{0}” za swoją i chce ją odzyskać. Kontakt:\ntelefon {1}\ne-mail {2}\nkomunikatory: {3}\n\nOgłoszenie: {4}\n\nZanim oddasz rzecz, zapytaj o szczegóły, których nie widać na zdjęciu.
claim.reminder.author.subject=DeRechi: czy rzecz „{0}” wróciła do właściciela?
claim.reminder.author.body=Przekazaliśmy Ci kontakt do osoby, która odpowiedziała na Twoje ogłoszenie „{0}”. Jeśli rzecz wróciła już do właściciela, zamknij ogłoszenie tutaj: {1}\n\nJeśli nikt tego nie potwierdzi, ogłoszenie trafi do archiwum mniej więcej tydzień po ostatniej odpowiedzi.
claim.reminder.claimant.subject=DeRechi: czy rzecz „{0}” została zwrócona?
claim.reminder.claimant.body=Przekazaliśmy Twój kontakt w sprawie ogłoszenia „{0}”. Czy rzecz została zwrócona? Jeśli tak, zamknij ogłoszenie tutaj: {1}\n\nJeśli nikt tego nie potwierdzi, ogłoszenie trafi do archiwum mniej więcej tydzień po ostatniej odpowiedzi.
claim.unlocked.subject=DeRechi: numer telefonu autora ogłoszenia „{0}”
claim.unlocked.body=Dziękujemy za wsparcie DeRechi. Numer telefonu osoby, która dodała ogłoszenie „{0}”: {1}\n\nUmów się w ruchliwym miejscu i nigdy nie płać niczego z góry.
