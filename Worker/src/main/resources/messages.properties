# Claim notifications. English, also the fallback for any other phone country.
# always-use-message-format is on: a single quote must be doubled ('').
# {0} item title, {1} claimant phone, {2} claimant email, {3} messengers, {4} notice link;
# in reminders {1} is the confirm link; in claim.unlocked {1} is the author's phone number.

claim.lost.subject=DeRechi: someone found your item
claim.lost.body=Someone says they found your item “{0}” and wants to return it. Their contacts:\nphone {1}\nemail {2}\nmessengers: {3}\n\nNotice: {4}\n\nMeet in a busy place and never pay anything in advance. DeRechi never asks for money.
claim.found.subject=DeRechi: the owner of the item you found showed up
claim.found.body=Someone says the item “{0}” you found is theirs and wants to get it back. Their contacts:\nphone {1}\nemail {2}\nmessengers: {3}\n\nNotice: {4}\n\nAsk them about details the photo does not show before handing it over.
claim.reminder.author.subject=DeRechi: is “{0}” back with its owner?
claim.reminder.author.body=We passed you the contacts of someone who responded to your notice “{0}”. If the item is back with its owner, close the notice here: {1}\n\nIf nobody confirms, the notice is archived about a week after the last response.
claim.reminder.claimant.subject=DeRechi: did you get “{0}” back?
claim.reminder.claimant.body=You responded to the notice “{0}”. Was the item returned? If so, close the notice here: {1}\n\nIf nobody confirms, the notice is archived about a week after the last response.
claim.unlocked.subject=DeRechi: the author''s phone number for “{0}”
claim.unlocked.body=Thank you for supporting DeRechi. The phone number of the person behind the notice “{0}”: {1}\n\nMeet in a busy place and never pay anything in advance.
claim.messengers.none=none
